openapi: 3.2.0
info:
  title: Fiserv CardPointe Gateway Signature Capture API
  description: The CardPointe Gateway API provides a RESTful interface for integrating secure tokenization, payment processing, and reporting features into applications and websites. The API supports authorization, capture, void, refund, and inquiry operations, as well as customer profile management for storing payment credentials securely.
  version: 1.0.0
  contact:
    name: Fiserv Developer Support
    url: https://developer.fiserv.com/product/CardPointe
  termsOfService: https://www.fiserv.com/en/legal.html
servers:
- url: https://{site}-uat.cardconnect.com/cardconnect/rest
  description: UAT Environment
  variables:
    site:
      default: fts
      description: The site name provided during onboarding.
- url: https://{site}.cardconnect.com/cardconnect/rest
  description: Production Environment
  variables:
    site:
      default: fts
      description: The site name provided during onboarding.
security:
- basicAuth: []
tags:
- name: Signature Capture
  description: Submit signature capture data for completed transactions.
paths:
  /sigcap:
    put:
      operationId: submitSignatureCapture
      summary: Fiserv Submit a signature capture
      description: Submits a captured signature image for a completed transaction. The signature data is associated with the transaction for record-keeping and dispute resolution.
      tags:
      - Signature Capture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignatureCaptureRequest'
      responses:
        '200':
          description: Signature captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureCaptureResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      description: Error response payload.
      properties:
        respstat:
          type: string
          description: The response status (C for declined/error).
        respcode:
          type: string
          description: The error response code.
        resptext:
          type: string
          description: A human-readable error message.
    SignatureCaptureResponse:
      type: object
      description: Signature capture response payload.
      properties:
        retref:
          type: string
          description: The retrieval reference number.
        respstat:
          type: string
          description: The response status.
        respcode:
          type: string
          description: The response code.
        resptext:
          type: string
          description: The response text.
    SignatureCaptureRequest:
      type: object
      description: Signature capture request payload.
      required:
      - merchid
      - retref
      - signature
      properties:
        merchid:
          type: string
          description: The CardPointe merchant ID.
        retref:
          type: string
          description: The retrieval reference number of the transaction.
        signature:
          type: string
          description: The base64-encoded signature image data.
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using the CardPointe Gateway credentials.
externalDocs:
  description: CardPointe Gateway API Documentation
  url: https://developer.fiserv.com/product/CardPointe/docs/?path=docs%2FAPIs%2FCardPointeGatewayAPI.md
