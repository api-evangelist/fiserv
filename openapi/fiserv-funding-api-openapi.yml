openapi: 3.2.0
info:
  title: Fiserv CardPointe Gateway Funding API
  description: The CardPointe Gateway API provides a RESTful interface for integrating secure tokenization, payment processing, and reporting features into applications and websites. The API supports authorization, capture, void, refund, and inquiry operations, as well as customer profile management for storing payment credentials securely.
  version: 1.0.0
  contact:
    name: Fiserv Developer Support
    url: https://developer.fiserv.com/product/CardPointe
  termsOfService: https://www.fiserv.com/en/legal.html
servers:
- url: https://{site}-uat.cardconnect.com/cardconnect/rest
  description: UAT Environment
  variables:
    site:
      default: fts
      description: The site name provided during onboarding.
- url: https://{site}.cardconnect.com/cardconnect/rest
  description: Production Environment
  variables:
    site:
      default: fts
      description: The site name provided during onboarding.
security:
- basicAuth: []
tags:
- name: Funding
  description: Retrieve funding information for settled transactions.
paths:
  /funding:
    get:
      operationId: getFundingInfo
      summary: Fiserv Get funding information
      description: Retrieves funding information for settled transactions, including deposit amounts and dates.
      tags:
      - Funding
      parameters:
      - name: merchid
        in: query
        required: true
        schema:
          type: string
        description: The CardPointe merchant ID.
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
        description: The funding date in MMDD format.
      responses:
        '200':
          description: Funding information returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundingResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ErrorResponse:
      type: object
      description: Error response payload.
      properties:
        respstat:
          type: string
          description: The response status (C for declined/error).
        respcode:
          type: string
          description: The error response code.
        resptext:
          type: string
          description: A human-readable error message.
    FundingResponse:
      type: object
      description: Funding information response.
      properties:
        fundingdate:
          type: string
          format: date
          description: The funding date.
        fundingmasterid:
          type: string
          description: The master funding identifier.
        txns:
          type: array
          items:
            type: object
            properties:
              retref:
                type: string
                description: The retrieval reference number.
              amount:
                type: string
                description: The transaction amount.
              type:
                type: string
                description: The transaction type.
          description: The funded transactions.
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using the CardPointe Gateway credentials.
externalDocs:
  description: CardPointe Gateway API Documentation
  url: https://developer.fiserv.com/product/CardPointe/docs/?path=docs%2FAPIs%2FCardPointeGatewayAPI.md
