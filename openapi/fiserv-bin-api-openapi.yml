openapi: 3.2.0
info:
  title: Fiserv CardPointe Gateway BIN API
  description: The CardPointe Gateway API provides a RESTful interface for integrating secure tokenization, payment processing, and reporting features into applications and websites. The API supports authorization, capture, void, refund, and inquiry operations, as well as customer profile management for storing payment credentials securely.
  version: 1.0.0
  contact:
    name: Fiserv Developer Support
    url: https://developer.fiserv.com/product/CardPointe
  termsOfService: https://www.fiserv.com/en/legal.html
servers:
- url: https://{site}-uat.cardconnect.com/cardconnect/rest
  description: UAT Environment
  variables:
    site:
      default: fts
      description: The site name provided during onboarding.
- url: https://{site}.cardconnect.com/cardconnect/rest
  description: Production Environment
  variables:
    site:
      default: fts
      description: The site name provided during onboarding.
security:
- basicAuth: []
tags:
- name: BIN
  description: Look up Bank Identification Number (BIN) data for cards.
paths:
  /bin/{token}/{merchid}:
    get:
      operationId: lookupBIN
      summary: Fiserv Look up BIN data
      description: Retrieves Bank Identification Number (BIN) data for a given token or card number, including card brand, card type, and issuing country information.
      tags:
      - BIN
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: The CardSecure token or card number to look up.
      - $ref: '#/components/parameters/MerchantIdPath'
      responses:
        '200':
          description: BIN data returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BINResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    MerchantIdPath:
      name: merchid
      in: path
      required: true
      schema:
        type: string
      description: The CardPointe merchant identifier.
  schemas:
    ErrorResponse:
      type: object
      description: Error response payload.
      properties:
        respstat:
          type: string
          description: The response status (C for declined/error).
        respcode:
          type: string
          description: The error response code.
        resptext:
          type: string
          description: A human-readable error message.
    BINResponse:
      type: object
      description: BIN lookup response payload.
      properties:
        country:
          type: string
          description: The issuing country.
        product:
          type: string
          description: The card product type (e.g., Visa, Mastercard).
        bin:
          type: string
          description: The Bank Identification Number.
        cardusestring:
          type: string
          description: The card use description (e.g., Credit, Debit).
        corporate:
          type: string
          description: Whether the card is a corporate card.
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using the CardPointe Gateway credentials.
externalDocs:
  description: CardPointe Gateway API Documentation
  url: https://developer.fiserv.com/product/CardPointe/docs/?path=docs%2FAPIs%2FCardPointeGatewayAPI.md
